<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title> Atividade4 task</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.store('tasks', {

                items: [
                    { id: 1, text: 'estudar Alpine', done: false },
                    { id: 2, text: 'fazer atividade', done: false },
                    { id: 3, text: 'terminar Projeto', done: true }
                ],

                filter: 'all',

                // Getter (Computed)
                get filtered() {
                    if (this.filter === 'done') {
                        return this.items.filter(t => t.done);
                    }

                    if (this.filter === 'todo') {
                        return this.items.filter(t => !t.done);
                    }

                    return this.items;
                },

                addTask(text) {
                    if (text.trim() === '') return;

                    this.items.push({
                        id: Date.now(),
                        text: text,
                        done: false
                    });
                },

                removeTask(task) {
                    this.items = this.items.filter(t => t !== task);},

                toggleTask(task) {
                    task.done = !task.done;}
            });
        });
    </script>
</head>

<body x-data class="min-h-screen bg-gray-100 flex justify-center p-6">
    <main class="w-full max-w-lg bg-white p-6 rounded-xl shadow space-y-6">

        <h1 class="text-2xl font-bold text-center">Minhas Tarefas</h1>

    <div x-data="{ newTask: '' }" class="flex gap-2">
        <input
            type="text"
            class="input input-bordered w-full"
            placeholder="Nova tarefa..."
            x-model="newTask"
            @keydown.enter="$store.tasks.addTask(newTask); newTask=''">

        <button
            class="btn btn-primary"
            @click="$store.tasks.addTask(newTask); newTask=''"
            :disabled="newTask.trim() === ''">
            +
        </button>
    </div>

    <div class="flex gap-2">
        <button class="btn btn-sm flex-1"
            @click="$store.tasks.filter='all'">
            Todas
        </button>
        <button class="btn btn-sm flex-1"
            @click="$store.tasks.filter='todo'">
            Pendentes
        </button>
        <button class="btn btn-sm flex-1"
            @click="$store.tasks.filter='done'">
            Feitas
        </button>
    </div>

    <ul class="space-y-2">

        <template x-for="task in $store.tasks.filtered" :key="task.id">
            <li class="flex items-center gap-3 p-3 bg-gray-50 rounded border">

                <input
                    type="checkbox"
                    class="checkbox checkbox-success"
                    :checked="task.done"
                    @change="$store.tasks.toggleTask(task)">

                <span
                    x-text="task.text"
                    :class="task.done ? 'line-through text-gray-400' : ''"
                    class="flex-1">
                </span>

                <button
                    class="btn btn-xs btn-error"
                    @click="$store.tasks.removeTask(task)">
                    X
                </button>
            </li>
        </template>
    </ul>
    <p
        x-show="$store.tasks.filtered.length === 0"
        class="text-center text-gray-500 italic">
        Nenhuma atividade encontrada.
    </p>

</main>
</body>
</html>
