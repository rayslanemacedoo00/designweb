<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atividade10</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <div x-data="{ mostrar: false }"
     @mouseenter="mostrar = true" @mouseleave="mostrar = false"
     class="bg-yellow-500" style="width:100px;height:100px;">
        <span x-show="mostrar" style="font-size: 24px;">Entrou!</span>
        <span x-show="!mostrar" style="font-size: 20px;">Saiu!</span>
    </div>

</body>
</html>
