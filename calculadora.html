<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

<div 
  x-data="{
    servicos: [],
    nome: '',
    valor: null}"
  class="card w-full max-w-md bg-white shadow-xl rounded-xl"
>
    <div class="card-body p-6 pb-4">
        <h2 class="text-xl font-bold mb-4 text-purple-700">Calculadora</h2>

        <div class="flex gap-2 mb-4">
            <input 
              type="text" 
              placeholder="Serviço" 
              x-model="nome"
              class="input input-bordered w-full">

            <input 
              type="number" 
              placeholder="Valor" 
              x-model.number="valor"
              class="input input-bordered w-28">

            <button 
              class="btn bg-purple-400 hover:bg-purple-500 text-white border-none"
              @click="
                if (nome && valor !== null) {
                    servicos.push({
                        nome: nome,
                        valor: Number(valor)
                    });
                    nome = '';
                    valor = null;}">adicionar
            </button>
        </div>

        <ul class="space-y-2">
            <template x-for="(s, i) in servicos" :key="i">
                <li class="flex justify-between items-center bg-gray-50 p-3 rounded-lg">
                    <span x-text="s.nome" class="font-medium"></span>

                    <div class="flex items-center gap-3">
                        <span x-text="'R$ ' + s.valor"></span>
                        <button 
                          class="btn btn-xs btn-error"
                          @click="servicos.splice(i, 1)"
                        >
                          −
                </button>
            </div>
         </li>
     </template>
    </ul>
</div>

<div class="bg-purple-700 text-white p-4 rounded-b-xl mt-4 flex justify-between items-center">
    <span class="font-bold">TOTAL</span>
    <span class="text-xl font-extrabold" x-text=" 'R$ ' + servicos.reduce((total, item) => total + Number(item.valor), 0) "></span>
</div>


</body>
</html>
